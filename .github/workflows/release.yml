name: Build & Release SensiDoc Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (例如 v1.4.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS App (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x86_64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.arch }}

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW_VER="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VER="${GITHUB_REF#refs/tags/}"
          else
            RAW_VER="v1.4.1"
          fi
          VER="${RAW_VER#v}"
          echo "VERSION=${VER}" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v${VER}" >> $GITHUB_OUTPUT

      - name: Run Tests
        if: matrix.arch == 'arm64'
        run: cargo test --verbose

      - name: Cache OCR Models
        id: cache-ocr-models
        uses: actions/cache@v4
        with:
          path: models/ocr
          key: ocr-models-v1

      - name: Download OCR Models for Full Offline Edition
        if: steps.cache-ocr-models.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/download_ocr_models.sh
          ./scripts/download_ocr_models.sh

      - name: Package macOS DMG (Standard & Full for ${{ matrix.arch }})
        env:
          APP_VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          chmod +x scripts/build_mac_app.sh
          ./scripts/build_mac_app.sh "v${{ steps.get_version.outputs.VERSION }}" "${{ matrix.arch }}"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sensidoc-v${{ steps.get_version.outputs.VERSION }}-macos-${{ matrix.arch }}
          path: dist/*.dmg

  build-windows:
    name: Build Windows Installer (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x86_64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: win-${{ matrix.target }}

      - name: Determine Version
        id: get_version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW_VER="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VER="${GITHUB_REF#refs/tags/}"
          else
            RAW_VER="v1.4.1"
          fi
          VER="${RAW_VER#v}"
          echo "VERSION=${VER}" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v${VER}" >> $GITHUB_OUTPUT

      - name: Run Tests
        if: matrix.arch == 'x86_64'
        run: cargo test --verbose

      - name: Cache OCR Models
        id: cache-ocr-models-win
        uses: actions/cache@v4
        with:
          path: models/ocr
          key: ocr-models-v1

      - name: Download OCR Models for Full Offline Edition
        if: steps.cache-ocr-models-win.outputs.cache-hit != 'true'
        shell: bash
        run: |
          chmod +x scripts/download_ocr_models.sh
          ./scripts/download_ocr_models.sh

      - name: Build Windows Installer (Standard & Full for ${{ matrix.arch }})
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.VERSION }}"
          ./scripts/build_win_installer.ps1 -Version $ver -Target "${{ matrix.target }}" -Arch "${{ matrix.arch }}"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sensidoc-v${{ steps.get_version.outputs.VERSION }}-windows-${{ matrix.arch }}
          path: |
            dist/*-setup.exe
            dist/*.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p release-files
          find release-artifacts -type f \( -name "*.dmg" -o -name "*-setup.exe" -o -name "*.zip" \) -exec cp {} release-files/ \;
          echo "Release files to upload:"
          ls -lh release-files/

      - name: Determine Tag Name
        id: release_tag
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW_VER="${{ github.event.inputs.version }}"
          else
            RAW_VER="${GITHUB_REF#refs/tags/}"
          fi
          VER="${RAW_VER#v}"
          echo "TAG=v${VER}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.TAG }}
          name: SensiDoc ${{ steps.release_tag.outputs.TAG }}
          files: release-files/*
          draft: false
          prerelease: false
          generate_release_notes: true
