[package]
name = "sensidoc"
version = "1.2.0"
edition = "2024"

[dependencies]
# 核心 Web 与异步运行时
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1.43", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 本地文档解析引擎
anydoc = { git = "https://github.com/firecrawl/anydoc", rev = "4e3089b1ed43404241a303109f81e2c7933040b2" }

# 序列化与数据处理
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"

# 网络请求与模型流式下载
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
async-stream = "0.3"

# 正则表达式与工具
encoding_rs = "0.8"
regex = "1.11"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.33"
wry = "0.56.1"
tao = "0.37.0"

# 原生 Office (DOCX/XLSX/PPTX) 与 PDF 重构脱敏引擎
zip = { version = "8.6", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
lopdf = { version = "0.38", default-features = false }

# 命令行解析 (CLI)
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }


